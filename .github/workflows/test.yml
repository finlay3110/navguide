name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # The tool is used on an iPhone, so WebKit is the engine that actually
    # matters. Chromium stays in the matrix because a few checks depend on
    # Chromium-only APIs (CDP, beforeinstallprompt) and are skipped elsewhere.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]

    name: test (${{ matrix.browser }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # --with-deps pulls the system libraries the engine needs on a bare runner.
      - run: npx playwright install --with-deps ${{ matrix.browser }}

      - run: npm test
        env:
          UCN_BROWSER: ${{ matrix.browser }}
